<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Tiles</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1d2330;--muted:#6b7280;--line:#e2e5ea;--accent:#2f6fed;--ok:#1f9d63;--warn:#d98a00;--bad:#d64545;--track:#e8ebf0}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1e232c;--ink:#e8ebf1;--muted:#9aa3b2;--line:#2c3340;--accent:#6b9bff;--ok:#3fbf88;--warn:#e8a93a;--bad:#ee6b6b;--track:#2c3340}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0 8px 0 0}
.sp{flex:1}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--bad)}
select,input,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:100%}
.hdr select,header select{width:auto}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
main{padding:16px;max-width:1300px;margin:0 auto}
.hint{color:var(--muted);margin:0 0 12px}
.gridwrap{position:relative}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:34px 30px;position:relative}
#links{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0}
#links path{fill:none;stroke-width:2;stroke-linecap:round}
.tile{position:relative;z-index:1;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px;padding:12px;cursor:grab;user-select:none;transition:box-shadow .1s,transform .1s}
.tile:hover{box-shadow:0 2px 10px rgba(0,0,0,.12)}
.tile.dragging{opacity:.4}
.tile.over{outline:3px dashed var(--accent);transform:scale(1.02)}
.tile.done{border-left-color:var(--ok)}
.tile.late{border-left-color:var(--bad)}
.tile.blocked .title::after{content:" \1F512";font-size:12px}
.title{font-weight:600;margin-bottom:6px;word-break:break-word}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px;margin-bottom:8px}
.meta .late{color:var(--bad);font-weight:600}
.bar{height:8px;background:var(--track);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.tile.done .bar>i{background:var(--ok)}
.pct{text-align:right;font-weight:600;font-size:13px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-size:11.5px;background:var(--track);border-radius:99px;padding:1px 8px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat b{display:block;font-size:24px}
.stat span{color:var(--muted);font-size:12.5px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:20px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:12.5px}
h2{font-size:15px;margin:18px 0 8px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:18px;width:min(520px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 12px}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 3px}
.row{display:flex;gap:10px}.row>*{flex:1}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.deps span{display:inline-flex;align-items:center;gap:4px;background:var(--track);border-radius:99px;padding:2px 4px 2px 10px;margin:2px 4px 2px 0}
.deps button{border:0;background:none;padding:0 6px;color:var(--bad)}
.auth{max-width:340px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}
.err{color:var(--bad);margin-top:8px;min-height:18px}
.empty{text-align:center;color:var(--muted);padding:50px 0}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:20}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<dialog id="dlg"></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://qkkcvbafkderoxlxvjww.supabase.co";
const SUPABASE_KEY = "sb_publishable_FzDjgkUIrncKMuyt253GsA_qK2fGKH1";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const S = { user:null, projects:[], pid:null, tasks:[], view:"tiles", type:"" };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const fmt = d => d ? new Date(d + "T00:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}) : "No due date";
const byId = id => S.tasks.find(t => t.id === id);

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.style.display="block"; clearTimeout(toast.h); toast.h=setTimeout(()=>t.style.display="none",2600); }

/* ---------- derived state ---------- */
const isDone = t => t.taskProgress >= 100;
const isLate = t => !isDone(t) && t.taskDue && new Date(t.taskDue+"T00:00:00") < today();
const isBlocked = t => !isDone(t) && (t.taskDependency||[]).some(id => { const d=byId(id); return d && !isDone(d); });

/* ---------- data ---------- */
async function loadProjects(){
  const { data, error } = await sb.from("tm_projects").select("*").order("created_at");
  if (error) return toast(error.message);
  S.projects = data;
  if (!S.projects.find(p => p.id === S.pid)) S.pid = localStorage.getItem("tm_pid");
  if (!S.projects.find(p => p.id === S.pid)) S.pid = S.projects[0]?.id ?? null;
  await loadTasks();
}
async function loadTasks(){
  S.tasks = [];
  if (S.pid){
    localStorage.setItem("tm_pid", S.pid);
    const { data, error } = await sb.from("tm_tasks").select("*").eq("project_id", S.pid).order("created_at");
    if (error) toast(error.message); else S.tasks = data;
  }
  render();
}
async function saveTask(t){
  const { id, user_id, created_at, ...fields } = t;
  const q = id ? sb.from("tm_tasks").update(fields).eq("id", id)
               : sb.from("tm_tasks").insert({ ...fields, project_id: S.pid });
  const { error } = await q;
  if (error) { toast(error.message); return false; }
  await loadTasks(); return true;
}

/* ---------- render ---------- */
function render(){
  const app = $("#app");
  if (!S.user){
    app.innerHTML = `<form class="auth" id="authForm">
      <h1 style="margin-top:0">Task Tiles</h1>
      <label>Email</label><input type="email" id="em" required autocomplete="username">
      <label>Password</label><input type="password" id="pw" required minlength="6" autocomplete="current-password">
      <div class="err" id="aerr"></div>
      <div class="actions" style="justify-content:space-between">
        <button type="button" id="signup">Create account</button>
        <button class="primary" type="submit">Sign in</button>
      </div></form>`;
    $("#authForm").onsubmit = async e => { e.preventDefault();
      const { error } = await sb.auth.signInWithPassword({ email:$("#em").value, password:$("#pw").value });
      if (error) $("#aerr").textContent = error.message; };
    $("#signup").onclick = async () => {
      const { data, error } = await sb.auth.signUp({ email:$("#em").value, password:$("#pw").value });
      $("#aerr").textContent = error ? error.message : (data.session ? "" : "Check your email to confirm, then sign in."); };
    return;
  }
  const types = [...new Set(S.tasks.map(t => t.taskType).filter(Boolean))].sort();
  app.innerHTML = `<header>
    <h1>Task Tiles</h1>
    <select id="proj">${S.projects.map(p=>`<option value="${p.id}" ${p.id===S.pid?"selected":""}>${esc(p.name)}</option>`).join("")}</select>
    <button id="newProj">+ Project</button>
    ${S.pid ? `<button id="delProj" class="danger" title="Delete project">Delete</button>` : ""}
    <span class="tabs"><button data-v="tiles" class="${S.view==="tiles"?"on":""}">Tiles</button><button data-v="report" class="${S.view==="report"?"on":""}">Report</button></span>
    <span class="sp"></span>
    ${S.view==="tiles" && types.length ? `<select id="typeF"><option value="">All types</option>${types.map(t=>`<option ${t===S.type?"selected":""}>${esc(t)}</option>`).join("")}</select>`:""}
    ${S.pid ? `<button class="primary" id="newTask">+ Task</button>`:""}
    <button id="out">Sign out</button>
  </header><main id="main"></main>`;
  $("#proj").onchange = e => { S.pid = e.target.value; loadTasks(); };
  $("#newProj").onclick = newProject;
  $("#delProj") && ($("#delProj").onclick = delProject);
  $("#newTask") && ($("#newTask").onclick = () => editTask());
  $("#typeF") && ($("#typeF").onchange = e => { S.type = e.target.value; render(); });
  $("#out").onclick = () => sb.auth.signOut();
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { S.view=b.dataset.v; render(); });

  if (!S.pid) return $("#main").innerHTML = `<div class="empty">Create your first project to get started.</div>`;
  S.view === "tiles" ? renderTiles() : renderReport();
}

function renderTiles(){
  const list = S.tasks.filter(t => !S.type || t.taskType === S.type);
  const m = $("#main");
  if (!S.tasks.length) return m.innerHTML = `<div class="empty">No tasks yet. Click <b>+ Task</b>.</div>`;
  m.innerHTML = `<p class="hint">Click a tile to edit. Drag one tile onto another to link them. &#128274; = waiting on an unfinished dependency.</p>
    <div class="gridwrap"><svg id="links"><defs>
      <marker id="ah-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)" stroke="none"/></marker>
      <marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ok)" stroke="none"/></marker>
      <marker id="ah-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--warn)" stroke="none"/></marker></defs></svg>
    <div class="grid">${list.map(t => {
      const cls = [isDone(t)&&"done", isLate(t)&&"late", isBlocked(t)&&"blocked"].filter(Boolean).join(" ");
      const deps = (t.taskDependency||[]).map(byId).filter(Boolean);
      return `<div class="tile ${cls}" draggable="true" data-id="${t.id}">
        <div class="title">${esc(t.taskTitle)}</div>
        <div class="meta"><span class="${isLate(t)?"late":""}">${isLate(t)?"Overdue · ":"Due "}${fmt(t.taskDue)}</span><span>${t.taskDuration}d</span></div>
        <div class="bar"><i style="width:${t.taskProgress}%"></i></div>
        <div class="pct">${t.taskProgress}%</div>
        ${(t.taskType||t.taskOwner||deps.length)?`<div class="chips">${t.taskType?`<span class="chip">${esc(t.taskType)}</span>`:""}${t.taskOwner?`<span class="chip">&#128100; ${esc(t.taskOwner)}</span>`:""}${deps.length?`<span class="chip">after: ${deps.map(d=>esc(d.taskTitle)).join(", ")}</span>`:""}</div>`:""}
      </div>`; }).join("")}</div></div>`;
  drawLinks();
  if (window.ResizeObserver){ renderTiles.ro?.disconnect(); renderTiles.ro = new ResizeObserver(drawLinks); renderTiles.ro.observe(m.querySelector(".grid")); }
  let dragId = null;
  m.querySelectorAll(".tile").forEach(el => {
    el.onclick = () => editTask(byId(el.dataset.id));
    el.ondragstart = e => { dragId = el.dataset.id; el.classList.add("dragging"); e.dataTransfer.effectAllowed="link"; e.dataTransfer.setData("text/plain", dragId); };
    el.ondragend = () => { el.classList.remove("dragging"); m.querySelectorAll(".over").forEach(x=>x.classList.remove("over")); };
    el.ondragover = e => { if (dragId && dragId !== el.dataset.id){ e.preventDefault(); el.classList.add("over"); } };
    el.ondragleave = () => el.classList.remove("over");
    el.ondrop = e => { e.preventDefault(); el.classList.remove("over");
      if (dragId && dragId !== el.dataset.id) confirmLink(dragId, el.dataset.id); dragId = null; };
  });
}

/* ---------- link arrows ---------- */
// Arrow runs from the prerequisite tile to the tile that depends on it. Lines sit behind the tiles, so only the gaps show.
function drawLinks(){
  const svg = $("#links"); if (!svg) return;
  svg.querySelectorAll("path.ln").forEach(p => p.remove());
  const wrap = svg.parentElement.getBoundingClientRect();
  const tiles = {};
  svg.parentElement.querySelectorAll(".tile").forEach(el => { const r = el.getBoundingClientRect();
    tiles[el.dataset.id] = { x:r.left-wrap.left, y:r.top-wrap.top, w:r.width, h:r.height }; });
  const NS = "http://www.w3.org/2000/svg";
  S.tasks.forEach(post => (post.taskDependency||[]).forEach(preId => {
    const a = tiles[preId], b = tiles[post.id]; if (!a || !b) return;
    const pre = byId(preId), gap = 3;
    let x1,y1,x2,y2,d;
    const ac = { x:a.x+a.w/2, y:a.y+a.h/2 }, bc = { x:b.x+b.w/2, y:b.y+b.h/2 };
    if (b.y > a.y + a.h/2){            // target is on a lower row: bottom -> top
      x1=ac.x; y1=a.y+a.h+gap; x2=bc.x; y2=b.y-gap; const k=Math.max(20,(y2-y1)/2);
      d=`M${x1},${y1} C${x1},${y1+k} ${x2},${y2-k} ${x2},${y2}`;
    } else if (b.y < a.y - a.h/2){     // target is on a higher row: top -> bottom
      x1=ac.x; y1=a.y-gap; x2=bc.x; y2=b.y+b.h+gap; const k=Math.max(20,(y1-y2)/2);
      d=`M${x1},${y1} C${x1},${y1-k} ${x2},${y2+k} ${x2},${y2}`;
    } else {                            // same row: side to side
      const right = bc.x > ac.x;
      x1=right?a.x+a.w+gap:a.x-gap; y1=ac.y; x2=right?b.x-gap:b.x+b.w+gap; y2=bc.y; const k=Math.max(12,Math.abs(x2-x1)/2);
      d=`M${x1},${y1} C${x1+(right?k:-k)},${y1} ${x2-(right?k:-k)},${y2} ${x2},${y2}`;
    }
    const p = document.createElementNS(NS,"path");
    const done = isDone(pre);
    p.setAttribute("class","ln"); p.setAttribute("d",d);
    p.setAttribute("stroke", done ? "var(--ok)" : "var(--muted)");
    p.setAttribute("marker-end", done ? "url(#ah-ok)" : "url(#ah-m)");
    if (!done) p.setAttribute("stroke-dasharray","none");
    svg.appendChild(p);
  }));
}
window.addEventListener("resize", drawLinks);

/* ---------- dependencies ---------- */
// would adding "pre must finish before post" create a loop? (i.e. is post already a prerequisite of pre, directly or indirectly)
function createsCycle(preId, postId){
  const seen = new Set(), stack = [preId];
  while (stack.length){ const id = stack.pop(); if (id === postId) return true;
    if (seen.has(id)) continue; seen.add(id);
    (byId(id)?.taskDependency||[]).forEach(x => stack.push(x)); }
  return false;
}
function confirmLink(xId, yId){
  const x = byId(xId), y = byId(yId), dlg = $("#dlg");
  if ((y.taskDependency||[]).includes(xId)) return toast(`"${x.taskTitle}" is already linked to "${y.taskTitle}"`);
  if (createsCycle(xId, yId)) return toast("That would create a circular dependency");
  dlg.innerHTML = `<h3>Link “${esc(x.taskTitle)}” to “${esc(y.taskTitle)}”?</h3>
    <p style="color:var(--muted)">“${esc(x.taskTitle)}” will need to be completed before “${esc(y.taskTitle)}” can be worked on.</p>
    <div class="actions"><button id="no">Cancel</button><button class="primary" id="yes">Link ${esc(x.taskTitle)} to ${esc(y.taskTitle)}</button></div>`;
  dlg.showModal();
  $("#no").onclick = () => dlg.close();
  $("#yes").onclick = async () => { dlg.close();
    await saveTask({ id:yId, taskDependency:[...(y.taskDependency||[]), xId] }); toast("Linked"); };
}

/* ---------- dialogs ---------- */
function newProject(){
  const dlg = $("#dlg");
  dlg.innerHTML = `<h3>New project</h3><label>Name</label><input id="pn" autofocus>
    <div class="actions"><button id="c">Cancel</button><button class="primary" id="ok">Create</button></div>`;
  dlg.showModal();
  $("#c").onclick = () => dlg.close();
  $("#ok").onclick = async () => { const name=$("#pn").value.trim(); if(!name) return;
    const { data, error } = await sb.from("tm_projects").insert({ name }).select().single();
    dlg.close(); if (error) return toast(error.message); S.pid = data.id; loadProjects(); };
}
async function delProject(){
  const p = S.projects.find(p=>p.id===S.pid);
  if (!confirm(`Delete project "${p.name}" and all its tasks?`)) return;
  const { error } = await sb.from("tm_projects").delete().eq("id", S.pid);
  if (error) return toast(error.message); S.pid = null; loadProjects();
}
function editTask(t){
  const isNew = !t; t = t || { taskTitle:"", taskDuration:1, taskDue:"", taskOwner:"", taskWorkers:[], taskProgress:0, taskDependency:[], taskType:"" };
  let deps = [...(t.taskDependency||[])];
  const dlg = $("#dlg");
  const types = [...new Set(S.tasks.map(x=>x.taskType).filter(Boolean))];
  const draw = () => {
    dlg.innerHTML = `<h3>${isNew?"New task":"Edit task"}</h3>
    <label>Name</label><input id="f_title" value="${esc(t.taskTitle)}">
    <div class="row"><div><label>Duration (days)</label><input id="f_dur" type="number" min="0" value="${t.taskDuration}"></div>
      <div><label>Due date</label><input id="f_due" type="date" value="${t.taskDue||""}"></div></div>
    <div class="row"><div><label>Owner</label><input id="f_owner" value="${esc(t.taskOwner)}"></div>
      <div><label>Type</label><input id="f_type" list="types" value="${esc(t.taskType)}"><datalist id="types">${types.map(x=>`<option value="${esc(x)}">`).join("")}</datalist></div></div>
    <label>Workers (comma separated)</label><input id="f_workers" value="${esc((t.taskWorkers||[]).join(", "))}">
    <label>Progress: <b id="pv">${t.taskProgress}</b>%</label><input id="f_prog" type="range" min="0" max="100" step="5" value="${t.taskProgress}">
    <label>Depends on (must be done first)</label>
    <div class="deps">${deps.map(id=>byId(id)).filter(Boolean).map(d=>`<span>${esc(d.taskTitle)}<button data-rm="${d.id}" title="Remove">&times;</button></span>`).join("") || `<em style="color:var(--muted)">None</em>`}</div>
    <select id="f_add" style="margin-top:6px"><option value="">+ Add dependency…</option>${S.tasks.filter(x=>x.id!==t.id && !deps.includes(x.id) && (isNew || !createsCycle(x.id,t.id))).map(x=>`<option value="${x.id}">${esc(x.taskTitle)}</option>`).join("")}</select>
    <div class="actions">${isNew?"":`<button class="danger" id="del" style="margin-right:auto">Delete</button>`}<button id="cx">Cancel</button><button class="primary" id="sv">Save</button></div>`;
    $("#f_prog").oninput = e => $("#pv").textContent = e.target.value;
    dlg.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { keep(); deps = deps.filter(i=>i!==b.dataset.rm); draw(); });
    $("#f_add").onchange = e => { if (e.target.value){ keep(); deps.push(e.target.value); draw(); } };
    $("#cx").onclick = () => dlg.close();
    $("#del") && ($("#del").onclick = async () => { if(!confirm("Delete this task?")) return;
      // remove references from other tasks first
      for (const o of S.tasks.filter(o => (o.taskDependency||[]).includes(t.id)))
        await sb.from("tm_tasks").update({ taskDependency:o.taskDependency.filter(i=>i!==t.id) }).eq("id",o.id);
      const { error } = await sb.from("tm_tasks").delete().eq("id", t.id); dlg.close();
      if (error) toast(error.message); else loadTasks(); });
    $("#sv").onclick = async () => { keep();
      if (!t.taskTitle.trim()) return toast("Name is required");
      t.taskDependency = deps;
      if (await saveTask(t)) dlg.close(); };
  };
  const keep = () => { // preserve typed values across redraws
    t = { ...t, taskTitle:$("#f_title").value, taskDuration:+$("#f_dur").value||0, taskDue:$("#f_due").value||null,
      taskOwner:$("#f_owner").value.trim(), taskType:$("#f_type").value.trim(),
      taskWorkers:$("#f_workers").value.split(",").map(s=>s.trim()).filter(Boolean), taskProgress:+$("#f_prog").value }; };
  draw(); dlg.showModal();
}

/* ---------- report ---------- */
function renderReport(){
  const T = S.tasks, m = $("#main");
  if (!T.length) return m.innerHTML = `<div class="empty">No tasks to report on.</div>`;
  const totalDur = T.reduce((a,t)=>a+t.taskDuration,0);
  const overall = totalDur ? Math.round(T.reduce((a,t)=>a+t.taskDuration*t.taskProgress,0)/totalDur) : Math.round(T.reduce((a,t)=>a+t.taskProgress,0)/T.length);
  const done = T.filter(isDone).length, late = T.filter(isLate).length, blocked = T.filter(isBlocked).length;
  const started = T.filter(t=>t.taskProgress>0 && !isDone(t)).length;
  const lastDue = T.map(t=>t.taskDue).filter(Boolean).sort().pop();
  const group = key => { const g = {};
    T.forEach(t => { const ks = key(t); (ks.length?ks:["(none)"]).forEach(k => (g[k] ||= []).push(t)); });
    return Object.entries(g).sort((a,b)=>a[0].localeCompare(b[0])); };
  const tbl = (title, rows) => `<h2>${title}</h2><table><tr><th>${title.replace("By ","")}</th><th>Tasks</th><th>Done</th><th>Overdue</th><th style="width:30%">Progress</th></tr>
    ${rows.map(([k,ts])=>{ const d=ts.reduce((a,t)=>a+t.taskDuration,0);
      const p = d ? Math.round(ts.reduce((a,t)=>a+t.taskDuration*t.taskProgress,0)/d) : Math.round(ts.reduce((a,t)=>a+t.taskProgress,0)/ts.length);
      return `<tr><td>${esc(k)}</td><td>${ts.length}</td><td>${ts.filter(isDone).length}</td><td>${ts.filter(isLate).length||""}</td>
      <td><div class="bar"><i style="width:${p}%"></i></div><small>${p}%</small></td></tr>`; }).join("")}</table>`;
  const attention = T.filter(t=>isLate(t)||isBlocked(t)).sort((a,b)=>(a.taskDue||"9").localeCompare(b.taskDue||"9"));
  m.innerHTML = `<div class="cards">
    <div class="stat"><b>${overall}%</b><span>Overall (duration-weighted)</span></div>
    <div class="stat"><b>${T.length}</b><span>Tasks</span></div>
    <div class="stat"><b>${done}</b><span>Complete</span></div>
    <div class="stat"><b>${started}</b><span>In progress</span></div>
    <div class="stat"><b style="color:${late?"var(--bad)":"inherit"}">${late}</b><span>Overdue</span></div>
    <div class="stat"><b>${blocked}</b><span>Blocked by dependency</span></div>
    <div class="stat"><b style="font-size:17px;line-height:32px">${lastDue?fmt(lastDue):"—"}</b><span>Last due date</span></div></div>
    ${attention.length?`<h2>Needs attention</h2><table><tr><th>Task</th><th>Due</th><th>Progress</th><th>Issue</th></tr>${attention.map(t=>`<tr><td>${esc(t.taskTitle)}</td><td>${fmt(t.taskDue)}</td><td>${t.taskProgress}%</td><td>${[isLate(t)&&"Overdue", isBlocked(t)&&"Waiting on "+t.taskDependency.map(byId).filter(d=>d&&!isDone(d)).map(d=>esc(d.taskTitle)).join(", ")].filter(Boolean).join(" · ")}</td></tr>`).join("")}</table>`:""}
    ${tbl("By type", group(t=>t.taskType?[t.taskType]:[]))}
    ${tbl("By owner", group(t=>t.taskOwner?[t.taskOwner]:[]))}
    ${tbl("By worker", group(t=>t.taskWorkers||[]))}`;
}

/* ---------- boot ---------- */
sb.auth.onAuthStateChange((_e, session) => {
  S.user = session?.user ?? null;
  if (S.user) loadProjects(); else { S.projects=[]; S.tasks=[]; render(); }
});
render();
</script>
</body>
</html>
